<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f4e37"><title>Thư mời</title>
<style>
:root{--ink:#34291f;--muted:#806d5b;--paper:#fffaf2;--accent:#9a704d;--line:#e9dccb;--bg:#f3eee7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.page{max-width:760px;margin:28px auto;padding:18px}.invite{background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 60px #4d38251c;position:relative;overflow:hidden;text-align:center;padding:clamp(28px,7vw,66px)}.invite:before,.invite:after{content:'✦';position:absolute;color:#c6a77f;font-size:24px}.invite:before{top:18px;left:20px}.invite:after{right:20px;bottom:18px}.eyebrow{letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font:11px Arial,sans-serif}.ornament{font-size:26px;color:var(--accent);margin:18px}.title{font-size:clamp(34px,8vw,58px);font-weight:400;line-height:1.08;margin:16px 0}.host{font-size:21px;margin:16px 0}.message{max-width:540px;margin:22px auto;color:var(--muted);font-size:17px;line-height:1.7;white-space:pre-line}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:30px auto}.detail{padding:16px;border:1px solid var(--line)}.detail b{display:block;font:11px Arial,sans-serif;letter-spacing:.12em;color:var(--accent);margin-bottom:8px}.detail span{font-size:16px;line-height:1.5}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px}.btn{border:1px solid var(--accent);background:var(--accent);color:white;padding:12px 20px;text-decoration:none;cursor:pointer;font:13px Arial,sans-serif;letter-spacing:.04em}.btn.secondary{background:transparent;color:var(--accent)}.rsvp{max-width:520px;margin:34px auto 0;text-align:left;border-top:1px solid var(--line);padding-top:26px}.rsvp h2{text-align:center;font-weight:400;font-size:28px}.field{width:100%;padding:12px;border:1px solid var(--line);background:white;margin:7px 0 16px;font:15px Arial,sans-serif;color:var(--ink)}label{font:12px Arial,sans-serif;color:var(--muted)}.status{min-height:24px;text-align:center;color:var(--accent);font:13px Arial,sans-serif}.footer{margin-top:26px;color:var(--muted);font:11px Arial,sans-serif;letter-spacing:.08em}.hidden{display:none!important}body.theme-wedding{--paper:#fff9f8;--accent:#a96f79;--line:#efd9dc}body.theme-birthday{--paper:#fffaf0;--accent:#bd7a36;--line:#f0dfbd}body.theme-opening{--paper:#fffaf0;--accent:#9b6a25;--line:#e9d7ae}body.theme-corporate{--paper:#f8fbff;--accent:#315d83;--line:#d7e2ee}@media(max-width:520px){.page{padding:10px;margin:8px auto}.details{grid-template-columns:1fr}.invite{padding:36px 20px}.actions .btn{flex:1}}
</style></head>
<body><main class="page"><article class="invite"><div class="eyebrow" id="eyebrow">Trân trọng kính mời</div><div class="ornament">❧</div><div class="eyebrow" id="subtitle">Một dịp đặc biệt</div><h1 class="title" id="title">Đang tải thiệp mời…</h1><div class="host" id="host"></div><p class="message" id="message"></p><div class="details"><div class="detail"><b>THỜI GIAN</b><span id="date">Đang cập nhật</span></div><div class="detail"><b>ĐỊA ĐIỂM</b><span id="address">Đang cập nhật</span></div></div><div class="actions"><a class="btn secondary hidden" id="map" target="_blank" rel="noopener">Xem bản đồ</a><a class="btn secondary hidden" id="calendar" download="loi-moi.ics">Lưu lịch</a></div><section class="rsvp"><h2>Xác nhận tham dự</h2><form id="rsvpForm"><label for="guest">Họ và tên</label><input class="field" id="guest" name="name" maxlength="120" required autocomplete="name" placeholder="Tên của bạn"><label for="attendance">Bạn sẽ tham dự?</label><select class="field" id="attendance" name="status"><option value="Sẽ tham dự">Tôi sẽ tham dự</option><option value="Không thể tham dự">Rất tiếc, tôi không thể tham dự</option></select><label for="count">Số người (bao gồm bạn)</label><input class="field" id="count" name="count" type="number" min="1" max="20" value="1" required><label for="wish">Lời nhắn (không bắt buộc)</label><textarea class="field" id="wish" name="wish" rows="3" maxlength="500" placeholder="Gửi lời chúc..."></textarea><button class="btn" id="send" type="submit">Gửi xác nhận</button><p class="status" id="status" role="status" aria-live="polite"></p></form></section><div class="footer">THƯ MỜI ĐIỆN TỬ</div></article></main>
<script>
'use strict';
const API_URL='PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
const params=new URLSearchParams(location.search);const eventId=params.get('event')||'';const guestName=params.get('ten')||'';let currentEvent=null;
const $=id=>document.getElementById(id);
function showError(msg){$('title').textContent='Chưa thể mở thiệp';$('message').textContent=msg+' Vui lòng kiểm tra đường dẫn hoặc liên hệ người gửi.';}
function loadEvent(){if(!API_URL.startsWith('https://script.google.com/')){showError('Chưa cấu hình API trong index.html.');return;}const cb='inviteCallback';window[cb]=data=>{delete window[cb];if(!data||!data.ok||!data.event){showError(data?.message||'Không tìm thấy sự kiện.');return;}render(data.event);};const s=document.createElement('script');s.src=API_URL+'?event='+encodeURIComponent(eventId)+'&callback='+cb;s.onerror=()=>showError('Không kết nối được máy chủ.');document.head.appendChild(s);}
function fmtDate(value){if(!value)return 'Theo thông tin người mời';const d=new Date(value);if(isNaN(d))return value;return new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'}).format(d);}
function render(e){currentEvent=e;document.body.classList.add('theme-'+(e.theme||'classic'));$('title').textContent=e.title||'Thư mời';$('subtitle').textContent=e.subtitle||'Trân trọng kính mời';$('host').textContent=e.host?('Trân trọng, '+e.host):'';$('message').textContent=e.message||'Sự hiện diện của bạn là niềm vui và vinh hạnh đối với chúng tôi.';$('date').textContent=fmtDate(e.date);$('address').textContent=e.address||'Sẽ được cập nhật';$('eyebrow').textContent=labelType(e.type);if(guestName)$('guest').value=guestName;if(e.mapUrl){$('map').href=e.mapUrl;$('map').classList.remove('hidden');}const start=new Date(e.date);if(!isNaN(start)){const end=e.endDate?new Date(e.endDate):new Date(start.getTime()+2*3600000);const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Thiep Moi Manager//VI','BEGIN:VEVENT','DTSTART:'+icsDate(start),'DTEND:'+icsDate(end),'SUMMARY:'+icsEscape(e.title),'LOCATION:'+icsEscape(e.address),'DESCRIPTION:'+icsEscape(e.message),'END:VEVENT','END:VCALENDAR'].join('\r\n');$('calendar').href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));$('calendar').classList.remove('hidden');}}
function labelType(t){return ({housewarming:'Thiệp mời tân gia',wedding:'Thiệp mời đám cưới',birthday:'Thiệp mời sinh nhật',opening:'Thiệp mời khai trương',corporate:'Thư mời sự kiện công ty'})[t]||'Trân trọng kính mời';}
function icsDate(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
$('rsvpForm').addEventListener('submit',async ev=>{ev.preventDefault();if(!currentEvent)return;const btn=$('send');btn.disabled=true;$('status').textContent='Đang gửi xác nhận…';const data=new URLSearchParams({eventId:currentEvent.id,name:$('guest').value.trim(),status:$('attendance').value,count:$('count').value,wish:$('wish').value.trim(),source:location.href});try{await fetch(API_URL,{method:'POST',mode:'no-cors',body:data});$('status').textContent='Đã gửi yêu cầu. Cảm ơn bạn! (Ban tổ chức vui lòng kiểm tra sheet RSVP để xác nhận dữ liệu.)';$('rsvpForm').reset();if(guestName)$('guest').value=guestName;}catch(err){$('status').textContent='Không gửi được. Vui lòng thử lại hoặc liên hệ người mời.';}finally{btn.disabled=false;}});
loadEvent();
</script></body></html>
